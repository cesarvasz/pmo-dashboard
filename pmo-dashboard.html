<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PMO Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    /* ── THEME VARIABLES ─────────────────────────────────────────────────── */
    :root, [data-theme="dark"] {
      --bg-base:        #0f1117;
      --bg-surface:     #1a1d27;
      --bg-sidebar:     #13151f;
      --bg-hover:       #1e2130;
      --bg-accent-soft: #1e1b4b;
      --border:         #2d3148;
      --border-subtle:  #334155;
      --text-primary:   #e2e8f0;
      --text-secondary: #9ca3af;
      --text-muted:     #6b7280;
      --text-disabled:  #4b5563;
      --accent:         #6c63ff;
      --accent-hover:   #5a52e0;
      --accent-dim:     #3d3d5c;
      --accent-light:   #a5b4fc;
      --code-bg:        #1e293b;
      --code-border:    #334155;
      --table-head-bg:  #1a1d27;
      --card-value-total: #e2e8f0;

      --pill-atrasado-bg: #450a0a; --pill-atrasado-fg: #fca5a5; --pill-atrasado-br: #7f1d1d;
      --pill-parahoy-bg:  #451a03; --pill-parahoy-fg:  #fcd34d; --pill-parahoy-br:  #78350f;
      --pill-entiempo-bg: #052e16; --pill-entiempo-fg: #6ee7b7; --pill-entiempo-br: #14532d;
      --pill-aprobada-bg: #1e1b4b; --pill-aprobada-fg: #a5b4fc; --pill-aprobada-br: #3730a3;
      --pill-skip-bg:     #1f2937; --pill-skip-fg:     #6b7280; --pill-skip-br:     #374151;

      --chart-grid:  #1e2130;
      --shadow:      rgba(0,0,0,0.4);
    }

    [data-theme="light"] {
      --bg-base:        #f0f2fa;
      --bg-surface:     #ffffff;
      --bg-sidebar:     #f8f9fd;
      --bg-hover:       #eef0f8;
      --bg-accent-soft: #ede9fe;
      --border:         #dde1ef;
      --border-subtle:  #c7d0e8;
      --text-primary:   #1e2130;
      --text-secondary: #4b5563;
      --text-muted:     #6b7280;
      --text-disabled:  #9ca3af;
      --accent:         #6c63ff;
      --accent-hover:   #5a52e0;
      --accent-dim:     #c7c3f8;
      --accent-light:   #6c63ff;
      --code-bg:        #f1f5f9;
      --code-border:    #dde1ef;
      --table-head-bg:  #f8f9fd;
      --card-value-total: #1e2130;

      --pill-atrasado-bg: #fee2e2; --pill-atrasado-fg: #991b1b; --pill-atrasado-br: #fca5a5;
      --pill-parahoy-bg:  #fef3c7; --pill-parahoy-fg:  #92400e; --pill-parahoy-br:  #fcd34d;
      --pill-entiempo-bg: #d1fae5; --pill-entiempo-fg: #065f46; --pill-entiempo-br: #6ee7b7;
      --pill-aprobada-bg: #ede9fe; --pill-aprobada-fg: #4c1d95; --pill-aprobada-br: #a5b4fc;
      --pill-skip-bg:     #f3f4f6; --pill-skip-fg:     #6b7280; --pill-skip-br:     #d1d5db;

      --chart-grid:  #e5e7eb;
      --shadow:      rgba(0,0,0,0.08);
    }

    /* ── RESET & BASE ───────────────────────────────────────────────────── */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg-base);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      transition: background 0.2s, color 0.2s;
    }

    /* ── SIDEBAR ─────────────────────────────────────────────────────────── */
    .sidebar {
      width: 220px; min-width: 220px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      height: 100vh; position: sticky; top: 0;
      transition: width 0.2s, min-width 0.2s, background 0.2s, border-color 0.2s;
      overflow: hidden; z-index: 100;
    }
    .sidebar.collapsed { width: 60px; min-width: 60px; }

    .sidebar-brand {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 16px; border-bottom: 1px solid var(--border); min-height: 62px;
    }
    .brand-inner { display: flex; align-items: center; gap: 10px; overflow: hidden; }
    .brand-icon {
      width: 28px; height: 28px; background: var(--accent); border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.85rem; font-weight: 700; color: #fff; flex-shrink: 0;
    }
    .brand-text {
      font-size: 0.95rem; font-weight: 700; color: var(--text-primary);
      letter-spacing: 0.04em; white-space: nowrap; overflow: hidden; transition: opacity 0.15s;
    }
    .sidebar.collapsed .brand-text { opacity: 0; pointer-events: none; }

    .collapse-btn {
      background: none; border: 1px solid var(--border); color: var(--text-muted);
      width: 24px; height: 24px; border-radius: 6px; cursor: pointer;
      font-size: 0.75rem; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: all 0.15s;
    }
    .collapse-btn:hover { border-color: var(--accent); color: var(--text-primary); }
    .sidebar.collapsed .collapse-btn { transform: rotate(180deg); }

    .nav-section-label {
      font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--text-disabled); padding: 16px 16px 6px;
      white-space: nowrap; overflow: hidden; transition: opacity 0.15s;
    }
    .sidebar.collapsed .nav-section-label { opacity: 0; }

    .nav-list { list-style: none; flex: 1; overflow-y: auto; padding: 8px; }

    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 10px; border-radius: 8px; cursor: pointer;
      color: var(--text-secondary); font-size: 0.875rem;
      text-decoration: none; transition: background 0.15s, color 0.15s;
      white-space: nowrap; overflow: hidden; position: relative; margin-bottom: 2px;
    }
    .nav-item:hover  { background: var(--bg-hover); color: var(--text-primary); }
    .nav-item.active { background: var(--bg-accent-soft); color: var(--accent-light); }
    .nav-item.active .nav-icon { color: var(--accent); }
    .nav-item.disabled { opacity: 0.4; cursor: not-allowed; pointer-events: none; }

    .nav-icon  { font-size: 1rem; width: 20px; text-align: center; flex-shrink: 0; }
    .nav-label { overflow: hidden; transition: opacity 0.15s; }
    .sidebar.collapsed .nav-label { opacity: 0; }

    .nav-soon {
      font-size: 0.6rem; background: var(--code-bg); color: var(--text-disabled);
      border: 1px solid var(--code-border); border-radius: 4px;
      padding: 1px 5px; margin-left: auto; flex-shrink: 0; transition: opacity 0.15s;
    }
    .sidebar.collapsed .nav-soon { opacity: 0; }

    .sidebar-footer {
      padding: 12px 16px; border-top: 1px solid var(--border);
      font-size: 0.7rem; color: var(--text-disabled);
      white-space: nowrap; overflow: hidden; transition: opacity 0.15s;
    }
    .sidebar.collapsed .sidebar-footer { opacity: 0; }

    /* ── CONTENT ─────────────────────────────────────────────────────────── */
    .content-wrap {
      flex: 1; display: flex; flex-direction: column;
      min-width: 0; height: 100vh; overflow-y: auto;
    }

    header {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 32px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 50;
      transition: background 0.2s, border-color 0.2s;
    }

    .header-left { display: flex; align-items: center; gap: 12px; }
    .page-title    { font-size: 1.15rem; font-weight: 600; color: var(--text-primary); }
    .page-subtitle { font-size: 0.78rem; color: var(--text-muted); }

    .meta { display: flex; align-items: center; gap: 12px; font-size: 0.8rem; color: var(--text-muted); }

    /* ── THEME TOGGLE ────────────────────────────────────────────────────── */
    .theme-toggle {
      width: 32px; height: 32px;
      background: var(--bg-hover);
      border: 1px solid var(--border);
      border-radius: 8px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; transition: all 0.2s; flex-shrink: 0;
      color: var(--text-secondary);
    }
    .theme-toggle:hover { border-color: var(--accent); color: var(--accent); background: var(--bg-accent-soft); }

    .refresh-btn {
      background: var(--accent); color: #fff; border: none;
      padding: 6px 14px; border-radius: 6px; cursor: pointer;
      font-size: 0.8rem; transition: background 0.2s;
    }
    .refresh-btn:hover    { background: var(--accent-hover); }
    .refresh-btn:disabled { background: var(--accent-dim); cursor: not-allowed; }

    .countdown { color: var(--text-secondary); font-size: 0.78rem; }
    #last-update { color: var(--text-muted); font-size: 0.78rem; }

    main { padding: 28px 32px; }

    /* ── PLACEHOLDER ─────────────────────────────────────────────────────── */
    .placeholder-page {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 60vh; gap: 16px; text-align: center;
    }
    .placeholder-icon  { font-size: 3rem; opacity: 0.25; }
    .placeholder-title { font-size: 1.1rem; font-weight: 600; color: var(--text-primary); }
    .placeholder-desc  { font-size: 0.85rem; color: var(--text-muted); max-width: 400px; line-height: 1.6; }
    .placeholder-hint  {
      font-size: 0.78rem; color: var(--text-disabled);
      background: var(--code-bg); border: 1px dashed var(--border);
      border-radius: 8px; padding: 12px 20px; max-width: 480px; line-height: 1.7;
    }
    .placeholder-hint code { color: var(--accent-light); font-family: monospace; }

    /* ── CARDS ───────────────────────────────────────────────────────────── */
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; margin-bottom: 28px; }
    .card {
      background: var(--bg-surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 18px; text-align: center;
      transition: background 0.2s, border-color 0.2s;
    }
    .card .value { font-size: 2.2rem; font-weight: 700; line-height: 1; margin-bottom: 6px; }
    .card .label { font-size: 0.75rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; }
    .card.atrasado  { border-color: #ef4444; } .card.atrasado  .value { color: #ef4444; }
    .card.parahoy   { border-color: #f59e0b; } .card.parahoy   .value { color: #f59e0b; }
    .card.entiempo  { border-color: #10b981; } .card.entiempo  .value { color: #10b981; }
    .card.aprobada  { border-color: var(--accent); } .card.aprobada  .value { color: var(--accent); }
    .card.total     .value { color: var(--card-value-total); }

    /* ── SECTIONS ────────────────────────────────────────────────────────── */
    .section { margin-bottom: 32px; }
    .section-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .section-header h2 { font-size: 1rem; font-weight: 600; color: var(--text-primary); }
    .section-header .badge {
      font-size: 0.72rem; padding: 2px 8px; border-radius: 999px;
      background: var(--bg-hover); color: var(--text-secondary);
    }
    .section-header .limit-badge {
      font-size: 0.72rem; padding: 2px 8px; border-radius: 999px;
      background: var(--code-bg); color: var(--text-muted); border: 1px solid var(--code-border);
    }

    /* ── TABLE ───────────────────────────────────────────────────────────── */
    .table-wrap { overflow-x: auto; border-radius: 10px; border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; font-size: 0.87rem; }
    thead th {
      background: var(--table-head-bg); padding: 10px 14px; text-align: left;
      font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em;
      color: var(--text-muted); border-bottom: 1px solid var(--border); white-space: nowrap;
    }
    tbody tr { border-bottom: 1px solid var(--bg-hover); transition: background 0.15s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--bg-hover); }
    tbody td { padding: 11px 14px; vertical-align: middle; background: var(--bg-surface); transition: background 0.15s; }
    tbody tr:hover td { background: var(--bg-hover); }
    .ini-id   { font-family: monospace; font-size: 0.8rem; color: var(--text-secondary); white-space: nowrap; }
    .ini-name { font-weight: 500; color: var(--text-primary); }
    .pm-name  { color: var(--accent-light); white-space: nowrap; }
    .grupo    { font-size: 0.78rem; color: var(--text-muted); white-space: nowrap; }

    /* ── PILLS ───────────────────────────────────────────────────────────── */
    .pill {
      display: inline-block; padding: 3px 10px; border-radius: 999px;
      font-size: 0.72rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.03em; white-space: nowrap;
    }
    .pill-atrasado { background: var(--pill-atrasado-bg); color: var(--pill-atrasado-fg); border: 1px solid var(--pill-atrasado-br); }
    .pill-parahoy  { background: var(--pill-parahoy-bg);  color: var(--pill-parahoy-fg);  border: 1px solid var(--pill-parahoy-br); }
    .pill-entiempo { background: var(--pill-entiempo-bg); color: var(--pill-entiempo-fg); border: 1px solid var(--pill-entiempo-br); }
    .pill-aprobada { background: var(--pill-aprobada-bg); color: var(--pill-aprobada-fg); border: 1px solid var(--pill-aprobada-br); }
    .pill-skip     { background: var(--pill-skip-bg);     color: var(--pill-skip-fg);     border: 1px solid var(--pill-skip-br); }

    /* ── PROGRESS BAR ────────────────────────────────────────────────────── */
    .progress-wrap { display: flex; align-items: center; gap: 8px; }
    .progress-bar  { flex: 1; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; min-width: 60px; }
    .progress-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }

    /* ── LOADER / ERROR ──────────────────────────────────────────────────── */
    .loader {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 80px; gap: 16px; color: var(--text-muted);
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border); border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-box {
      background: var(--pill-atrasado-bg); border: 1px solid var(--pill-atrasado-br);
      color: var(--pill-atrasado-fg); border-radius: 10px; padding: 20px 24px; margin: 20px 0;
    }

    /* ── FILTER ROW ──────────────────────────────────────────────────────── */
    .filter-row { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; margin-bottom: 28px; }

    .filter-reset {
      background: none; color: var(--text-muted); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 14px; font-size: 0.8rem; font-family: inherit;
      cursor: pointer; transition: all 0.15s; align-self: flex-end; white-space: nowrap;
    }
    .filter-reset:hover { border-color: #ef4444; color: #ef4444; }

    /* ── MULTI-SELECT DROPDOWN ───────────────────────────────────────────── */
    .ms-wrap { position: relative; display: flex; flex-direction: column; gap: 5px; }

    .ms-label {
      font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--text-muted); font-weight: 500;
    }

    .ms-trigger {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      min-width: 190px; padding: 8px 12px;
      background: var(--bg-surface); color: var(--text-primary);
      border: 1px solid var(--border); border-radius: 8px;
      cursor: pointer; font-size: 0.85rem; font-family: inherit;
      transition: border-color 0.15s;
      white-space: nowrap;
    }
    .ms-trigger:hover      { border-color: var(--accent); }
    .ms-trigger.active     { border-color: var(--accent); background: var(--bg-accent-soft); color: var(--accent-light); }
    .ms-chevron            { flex-shrink: 0; opacity: 0.5; transition: transform 0.2s; }
    .ms-trigger.open .ms-chevron { transform: rotate(180deg); }

    .ms-panel {
      display: none; position: absolute; top: calc(100% + 6px); left: 0;
      min-width: 100%; background: var(--bg-surface);
      border: 1px solid var(--border); border-radius: 10px;
      box-shadow: 0 8px 24px var(--shadow); z-index: 300;
      overflow: hidden; min-width: 200px;
    }
    .ms-panel.open { display: block; }

    .ms-option {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 14px; cursor: pointer; font-size: 0.85rem;
      color: var(--text-primary); transition: background 0.1s; user-select: none;
    }
    .ms-option:hover { background: var(--bg-hover); }
    .ms-option input[type="checkbox"] { accent-color: var(--accent); width: 14px; height: 14px; flex-shrink: 0; cursor: pointer; }
    .ms-all-opt { font-weight: 600; }
    .ms-sep { height: 1px; background: var(--border); margin: 2px 0; }
    .ms-count { margin-left: auto; font-size: 0.75rem; color: var(--text-muted); }

    /* ── CLICKABLE CARDS ─────────────────────────────────────────────────── */
    .card.clickable { cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; }
    .card.clickable:hover { transform: translateY(-2px); }
    .card.card-active.atrasado  { background: #450a0a55; box-shadow: 0 0 0 2px #ef4444; }
    .card.card-active.parahoy   { background: #451a0355; box-shadow: 0 0 0 2px #f59e0b; }
    .card.card-active.entiempo  { background: #052e1655; box-shadow: 0 0 0 2px #10b981; }
    .card.card-active           { box-shadow: 0 0 0 2px var(--accent); }

    /* ── CHART (REQ page only) ───────────────────────────────────────────── */
    .chart-container {
      background: var(--bg-surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 20px 24px; margin-bottom: 28px;
      transition: background 0.2s;
    }
    .chart-title { font-size: 0.85rem; font-weight: 600; color: var(--text-primary); margin-bottom: 16px; }
    .chart-wrap  { position: relative; height: 240px; }

    /* ── HEALTH SCORE ────────────────────────────────────────────────────── */
    .health-card {
      background: var(--bg-surface); border: 2px solid var(--border);
      border-radius: 12px; padding: 24px 28px; margin-bottom: 16px;
      transition: background 0.2s, border-color 0.2s;
    }
    .health-title {
      font-size: .72rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .08em; color: var(--text-muted); margin-bottom: 16px;
    }
    .health-row {
      display: flex; align-items: center; gap: 20px; flex-wrap: wrap; margin-bottom: 14px;
    }
    .health-pct { font-size: 3rem; font-weight: 800; line-height: 1; min-width: 88px; }
    .health-bar-outer {
      flex: 1; min-width: 120px;
      height: 10px; background: var(--border); border-radius: 5px; overflow: hidden;
    }
    .health-bar-fill { height: 100%; border-radius: 5px; transition: width 0.8s ease; }
    .health-badge-lg {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 5px 14px; border-radius: 999px; font-size: .82rem; font-weight: 700;
      white-space: nowrap;
    }
    .health-breakdown {
      display: flex; gap: 20px; flex-wrap: wrap; font-size: .82rem; font-weight: 600;
    }

    /* ── PORTFOLIO OVERVIEW ─────────────────────────────────────────────── */
    .pf-global {
      background: var(--bg-surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 20px 24px;
      display: flex; gap: 0; margin-bottom: 8px; flex-wrap: wrap;
      transition: background 0.2s, border-color 0.2s;
    }
    .pf-global-block {
      flex: 1; min-width: 200px; padding: 6px 20px;
      border-radius: 8px; cursor: pointer; transition: background 0.15s;
    }
    .pf-global-block:first-child { padding-left: 4px; }
    .pf-global-block:hover { background: var(--bg-hover); }
    .pf-global-title {
      font-size: .75rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .07em; color: var(--text-muted); margin-bottom: 10px;
    }
    .pf-global-sep { width: 1px; background: var(--border); margin: 0 4px; align-self: stretch; }
    .pf-global-stats { display: flex; gap: 18px; flex-wrap: wrap; align-items: center; }
    .pf-gstat { font-size: .88rem; font-weight: 600; white-space: nowrap; }

    .pf-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
      gap: 16px;
    }
    .pf-card {
      background: var(--bg-surface); border: 2px solid var(--border);
      border-radius: 12px; overflow: hidden;
      transition: background 0.2s, box-shadow 0.15s;
    }
    .pf-card:hover { box-shadow: 0 4px 20px var(--shadow); }
    .pf-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 18px; border-bottom: 1px solid var(--border);
    }
    .pf-name  { font-weight: 700; font-size: .95rem; color: var(--text-primary); }
    .pf-badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 10px; border-radius: 999px; font-size: .75rem; font-weight: 700;
    }
    .pf-boards  { display: flex; }
    .pf-divider { width: 1px; background: var(--border); flex-shrink: 0; }
    .pf-section {
      flex: 1; padding: 14px 18px; cursor: pointer; transition: background 0.15s; min-width: 0;
    }
    .pf-section:hover { background: var(--bg-hover); }
    .pf-section.pf-empty { cursor: default; }
    .pf-section.pf-empty:hover { background: transparent; }
    .pf-section-head {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;
    }
    .pf-section-label {
      font-size: .7rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .07em; color: var(--text-muted);

    .pf-section:hover .pf-go { opacity: 1; }

    .pf-dot   { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

    /* ── PM HEALTH CARDS ─────────────────────────────────────────────────── */
    .pm-health-row {
      display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 28px;

      border-radius: 12px; padding: 18px 22px; min-width: 190px; flex: 1;
      cursor: pointer; transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
      display: flex; flex-direction: column; gap: 6px;
    }
    .pm-health-card:hover { transform: translateY(-2px); }
    .pm-health-card.ph-active { box-shadow: 0 0 0 3px var(--accent); }
    .pm-health-name   { font-weight: 600; font-size: 0.9rem; color: var(--text-primary); }
    .pm-health-badge  {
      display: inline-flex; align-items: center; gap: 5px;

      font-size: 0.78rem; font-weight: 700; width: fit-content;
